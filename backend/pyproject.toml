[project]
name = "sentineliq"
version = "1.0.0"
description = "SentinelIQ — Incident Correlation & Triage Copilot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-redis>=0.1.0",
    "voyageai>=0.2.0",
    "neo4j>=5.24.0",
    "cohere>=5.9.0",
    "python-evtx>=0.7.0",
    "reportlab>=4.2.0",
    "langfuse>=2.51.0",
    "redis>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.22.0",
    "httpx>=0.27.0",
]
eval = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    "sentence-transformers>=3.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as requiring a real PostgreSQL+pgvector database (deselect with '-m \"not integration\"')",
]
